services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - frontdesk_db:/var/lib/postgresql/data
volumes:
  frontdesk_db:
