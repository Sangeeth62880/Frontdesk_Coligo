name: Hosted auto-close sweep
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.FRONTDESK_BASE_URL }}
      SWEEP_TOKEN: ${{ secrets.FRONTDESK_SWEEP_TOKEN }}
    steps:
      - name: Close expired customer waits
        if: env.BASE_URL != '' && env.SWEEP_TOKEN != ''
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 2 \
            --request POST "${BASE_URL%/}/admin/sweep" \
            --header "Authorization: Bearer $SWEEP_TOKEN"
