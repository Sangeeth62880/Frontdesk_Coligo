name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: frontdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://frontdesk:test-only-password@localhost:5432/frontdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check frontdesk scripts tests
      - run: uv run mypy --explicit-package-bases --check-untyped-defs frontdesk scripts
      - run: uv run python -m scripts.verify
      - run: uv run pip-audit --format json --output output-pip-audit.json
      - run: npm audit --audit-level=low
      - name: Save audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence
          path: |
            output/audit/
            output/screens/
            output-pip-audit.json
      - run: node --check frontdesk/static/app.js
      - run: node --check frontdesk/static/customer.js
      - name: Build deployment image
        run: docker build --tag frontdesk:ci .
