<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Frontdesk · Arvo Systems</title><link rel="stylesheet" href="/static/agent.css?v=3"><script src="/static/app.js?v=3" defer></script></head>
<body>
<a class="skip-link" href="#main">Skip to tickets</a>
<header class="topbar">
<a class="brand" href="#tickets">Frontdesk</a>
<nav aria-label="Ticket queues"><button data-queue="me" class="navitem selected" aria-current="page">Mine <span id="my-count">—</span></button><span class="nav-separator" aria-hidden="true">·</span><button data-queue="unassigned" class="navitem">Unassigned <span id="unassigned-count">—</span></button><span class="nav-separator" aria-hidden="true">·</span><button data-queue="all" class="navitem">All <span id="all-count">—</span></button></nav>
<label class="search"><span class="sr-only">Search tickets</span><input id="search" type="search" placeholder="Search tickets…" aria-label="Search tickets"></label>
<button id="new-ticket" class="primary">New ticket</button>
<div class="agent-menu"><span id="agent" aria-label="Signed-in agent"></span><details class="overflow"><summary aria-label="Workspace menu">…</summary><div class="menu"><button id="refresh">Refresh tickets</button><button id="signout">Sign out</button></div></details></div>
</header>
<main id="main" tabindex="-1">
<section id="list-page" aria-label="Ticket list">
<div class="list-toolbar"><label for="status-filter">Status:</label><select id="status-filter"><option value="active">Active</option><option value="all">All statuses</option><option value="waiting_on_customer">Waiting</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><span>All times IST</span></div>
<div class="table-scroll"><table class="tickets"><caption class="sr-only">Tickets, late tickets first. Use j and k to move, Enter to open.</caption><thead><tr><th scope="col">ID</th><th scope="col">Subject</th><th scope="col">Status</th><th scope="col">Priority</th><th scope="col" id="assignee-heading">Assignee</th><th scope="col">Last activity</th><th scope="col">Resolution due</th></tr></thead><tbody id="ticket-list"></tbody></table></div>
<div id="queue-footer" class="queue-footer"></div>
</section>
<section id="detail" class="ticket-page" aria-label="Ticket" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="login-dialog" aria-labelledby="login-title"><form id="login-form"><h2 id="login-title">Welcome to your desk</h2><label>Email<input id="login-email" type="email" required autocomplete="username" maxlength="320"></label><label>Password<input id="login-password" type="password" required autocomplete="current-password" maxlength="1024"></label><p id="login-error" class="danger-text" role="alert"></p><button class="primary full-width" type="submit">Sign in</button><!-- DEMO_LOGIN_HINT --></form></dialog>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form"><div class="dialog-heading"><div><h2 id="create-title">Create a ticket</h2></div><button type="button" class="quiet close-dialog" aria-label="Close new ticket">Close</button></div><label>Subject<input name="subject" required maxlength="300" placeholder="A brief description of the problem"></label><label>Customer email<input name="customer_email" type="email" required maxlength="320" placeholder="customer@company.com"></label><label>Source<select name="source"><option value="customer" selected>Customer request</option><option value="agent">Agent-initiated</option></select></label><label>Priority<select name="priority"><option value="medium">Medium · Reply in 4.5 working hours</option><option value="urgent">Urgent · Customer cannot work</option><option value="small">Small · Question or request</option></select></label><p id="create-error" role="alert" class="danger-text"></p><div class="dialog-actions"><button type="button" class="secondary close-dialog">Cancel</button><button type="submit" class="primary">Create ticket</button></div></form></dialog>
</body></html>
