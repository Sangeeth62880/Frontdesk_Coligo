[project]
name = "frontdesk"
version = "0.1.0"
description = "Support tickets with business-time SLAs and an immutable audit trail"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.165,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
    "hypothesis>=6.170.17",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "playwright>=1.65.2",
    "pytest-playwright>=0.10.0",
    "hypothesis-jsonschema>=0.23.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
