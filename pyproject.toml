[project]
name = "frontdesk"
version = "0.1.0"
description = "Support tickets with business-time SLAs and an immutable audit trail"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.165,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
